# Builds the app with OpenNext and deploys it to Cloudflare Workers (see
# DEPLOYMENT.md). The build always runs; the deploy step skips with a notice
# until the CLOUDFLARE_API_TOKEN repository secret exists.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    # Only the upstream repo deploys; a fork has no Worker to deploy to.
    if: github.repository == 'n8watkins/net_trailers'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
      HUSKY: 0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Inlined into the pages at build time; all public (they ship in every page).
      # The app's canonical address: email links, sitemap, metadata (DEPLOYMENT.md).
      NEXT_PUBLIC_APP_URL: https://net-trailers.n8builds.dev
      # The n8builds.dev GA4 property, shared with n8builds.dev and the portfolio.
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-JZQGKY9Q37
      NEXT_PUBLIC_SENTRY_DSN: https://e8ff08283b0f2f9db0042fd4d186acfe@o4507767562371072.ingest.us.sentry.io/4510041561759744
      # Turnstile on the sign-in form (lib/turnstile.ts); its secret is a Worker secret.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAF70opMyKqLHlESW
      NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:worker

      # A build whose server throws on a cookie header never reaches the live
      # site (scripts/check-worker.ts).
      - name: Built Worker answers requests with a cookie
        run: npm run check:worker

      - name: Waiting for setup
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built, but skipping the deploy until the CLOUDFLARE_API_TOKEN secret is added (DEPLOYMENT.md)."

      - name: Deploy
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          npx opennextjs-cloudflare deploy 2>&1 | tee deploy.log
          version=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | tail -1 | cut -d' ' -f4)
          if [ -z "$version" ]; then echo "::error::The deploy printed no Current Version ID."; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every edge-cached public page, as a signed-out visitor, over about a
      # minute: each must come from the version just deployed and load all of
      # its /_next/static files (scripts/check-deploy.ts, DEPLOYMENT.md).
      - name: Check the live site
        id: check
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-deploy.ts --build "${{ steps.deploy.outputs.version }}"

      # A failed check means visitors are getting broken pages now. Deploying
      # the same build again starts a fresh cache (what cleared it on
      # 2026-11-25), so do that once to repair the site, then fail the run
      # either way: the cause still needs a look.
      - name: Redeploy once after a failed check
        id: redeploy
        if: steps.check.outcome == 'failure'
        shell: bash
        run: |
          npx opennextjs-cloudflare deploy 2>&1 | tee redeploy.log
          version=$(grep -oE 'Current Version ID: [0-9a-f-]+' redeploy.log | tail -1 | cut -d' ' -f4)
          if [ -z "$version" ]; then echo "::error::The redeploy printed no Current Version ID."; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the live site again
        id: recheck
        if: steps.redeploy.outcome == 'success'
        continue-on-error: true
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-deploy.ts --build "${{ steps.redeploy.outputs.version }}"

      - name: Fail on a broken deploy
        if: steps.check.outcome == 'failure'
        shell: bash
        run: |
          if [ "${{ steps.recheck.outcome }}" = "success" ]; then
            echo "::error::The live site served broken or outdated pages after the deploy; a second deploy repaired it. See 'Check the live site' for what visitors got."
          else
            echo "::error::The live site serves broken or outdated pages after the deploy, and a second deploy did not repair it. Roll back (DEPLOYMENT.md) and see 'Check the live site again'."
          fi
          exit 1
